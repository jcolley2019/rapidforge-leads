<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RapidForge</title>
    <!-- Brand typography (JoeyC guide): Space Grotesk UI, JetBrains Mono
         data, Orbitron logotype only. Same delivery as joeyc.ai. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the persisted theme before first paint (dark is the default;
      // key mirrors src/lib/theme.ts THEME_STORAGE_KEY).
      try {
        if (localStorage.getItem("rapidforge-theme") === "light") {
          document.documentElement.classList.remove("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
