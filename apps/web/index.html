<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RapidForge</title>
    <!-- Brand fonts are self-hosted via @fontsource (see src/main.tsx) —
         no render-blocking third-party stylesheet. -->
    <script>
      // Apply the persisted theme before first paint (dark is the default;
      // key mirrors src/lib/theme.ts THEME_STORAGE_KEY).
      try {
        if (localStorage.getItem("rapidforge-theme") === "light") {
          document.documentElement.classList.remove("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
